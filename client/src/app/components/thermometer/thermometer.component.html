@if(popularity) {
  <div class="progress">
	<!--TODO: set style.background-color based on the level of popularity and style.width via the popularity's percent. Display percent.-->
  <div class="progress-bar" [style.background-color]="popularity.color" [style.width]="popularity.percentageString" role="progressbar" aria-valuenow="popularity.percent*100" aria-valuemin="0" aria-valuemax="100">
  	<span class="progress-bar-text">Popularity: {{popularity.percentageString}}</span>
  </div>
</div>
}
